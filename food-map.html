"],["豊漁丸","糸島・船越漁港","燒生蠔、扇貝、蠑螺","蠔約¥1,000–1,300/kg＋枱費；每人約¥2,000–3,000","10:00–18:00（L.O.17:00）；不定休","福岡県糸島市志摩船越415-17","https://www.walkerplus.com/article/177533/","老漁民經營・約240席・收得最夜"]],"days":[["11.12","四","抵達福岡・LaLaport・Costco 久山・民宿 BBQ","12:25抵達福岡，取車後13:00去 LaLaport 福岡睇高達同食晏，再行 AEON Mall 福岡；17:30 Costco 久山買 BBQ 食材（20:00關門），19:00返大岳民宿 BBQ。",[["午餐 · 約13:00 · LaLaport 福岡",[42,43,44],"首選わっぱ定食堂（3F）福岡家常定食；後備ぎゅう丸クラシック（漢堡扒）或肉肉うどん（牛肉烏冬），三間都喺商場內。落機後時間緊，揀出餐快嘅。"],["下午茶／後備 · AEON Mall 福岡",[40,41],"如果 LaLaport 冇食晏，AEON Mall 福岡 1F 有ぎゅう丸同築地食堂源ちゃん。夜晚有 BBQ，下晝唔好食太飽。"],["晚餐 · 約19:00 · 大岳民宿 BBQ",[],"用 Costco 久山買嘅和牛、海鮮、蔬菜喺民宿 BBQ。Costco 20:00關門，17:30前後要到；生鮮食材唔好長時間留喺車廂。"]]],["11.13","五","糸島：牡蠣小屋・またいちの塩・雷山千如寺・二見ヶ浦","晏晝船越漁港烤蠔，之後またいちの塩食花鹽布甸，下晝雷山千如寺睇大楓，17:00二見ヶ浦睇日落。全日喺糸島，車程長。",[["午餐 · 約11:30 · 船越漁港牡蠣小屋",[70,71,72,73],"首選船越漁港マルハチ：漁港邊嘅小屋，自己用炭火燒蠔同海鮮，去またいちの塩只係約10分鐘車程；滿座可以即刻轉隔籬ケンちゃんかき或豊漁丸。住吉丸喺加布里漁港，Google 評分最高、有天然大蛤，但同下一站唔順路。價錢同營業時間係舊季資料，11月初開季，去之前打電話確認同訂位；着唔怕污糟嘅衫。"],["下午茶 · またいちの塩／野北海岸",[62],"またいちの塩 工房とったん（芥屋3757，10:00–17:00）有名物花鹽布甸，喺製鹽所食就得。想坐低睇海可以去野北海岸嘅 CURRENT（17:00最後點餐），順路先去，唔好影響16:30前入千如寺。"],["晚餐 · 約19:00 · 大岳民宿",[],"睇完日落返民宿用 Costco 食材煮；或者回程途中簡單食。"]]],["11.14","六","門司港・博多運河城・聖誕市集","朝早去門司港食名物燒咖喱，下晝返博多運河城，夜晚行聖誕市集。門司港來回各約1.5小時。",[["午餐 · 約12:00 · 門司港",[58,9,8],"首選伽哩本舗 門司港レトロ店：門司港站行2分鐘，Tabelog 約3.55、約800則評價。こがねむし分數最高（約3.58）但位少、售完即止；BEAR FRUITS 喺門司港站對面，無休、座位多。星期六三間都要預排隊。"],["下午小食 · 約16:00 · 運河城／櫛田神社",[59],"かろのうろん 喺運河城隔籬、櫛田神社旁，烏冬百名店，17:00前後收（賣完即止），想食要一到博多就先去。夜晚有聖誕市集，淺嚐就夠。"],["晚餐 · 約18:00 · 聖誕市集／博多",[61,53,54],"今晚係食牛腸鍋最好嘅一日：星期六徳永屋 総本店由11:30開到24:00（Tabelog 約3.73，櫛田神社附近），建議訂位。後備おおやま喺博多站，行完聖誕市集（JR博多站前廣場，星期六12:00–23:00）就到；とり田水炊雞鍋要預約。市集有香腸、熱紅酒等小食，留肚食鍋。揸車嗰位唔好飲酒。"]]],["11.15","日","武雄神社・嬉野館","大岳退房後去武雄：先食井手ちゃんぽん，再去武雄神社睇大楠（御船山樂園可選），下晝入住嬉野館食自助餐。",[["午餐 · 約11:15 · 武雄",[37,64],"首選井手ちゃんぽん本店：佐賀老牌什錦麵，喺去武雄神社途中，有停車位。如果想留肚去嬉野先食，宗庵よこ長嘅溫泉湯豆腐定食係嬉野名物（午市到15:00），離嬉野館好近。"],["下午茶 · 入住嬉野館前",[45],"早到嬉野溫泉街可以試嬉野茶甜品；時間緊就直接去酒店浸溫泉。"],["晚餐 · 約18:00 · 嬉野館 Buffet",[],"酒店自助晚餐；記得核實兩筆訂房係咪都包早晚餐。"]]],["11.16","一","嬉野退房・柳川鰻魚・鳥栖 Outlet","11/16 星期一：柳川遊船後食若松屋鰻魚蒸籠飯（本吉屋休息），下晝去鳥栖 Outlet，晚餐喺 Outlet Food Court 食極味や。",[["午餐 · 12:30–13:45 · 柳川",[21,46,22],"首選若松屋鰻魚蒸籠飯；11/16 星期一本吉屋休息。後備日の出屋（可預約、有停車位）或皿屋福柳。遊船延誤就預留食飯彈性。"],["晚餐 · 約18:30 · 鳥栖 Outlet Food Court",[65,33,35],"你揀嘅極味や喺 Outlet Food Court，自己喺鐵板燒漢堡扒，最後點餐19:30。老實講呢間分店 Tabelog 只有約3.06（2025年4月先開、評價少），福岡本店先係人氣店。想食分數高啲：回転寿司しげなが（Outlet 附近，約3.45）或恵比須拉麵（約3.55）。"]]],["11.17","二","大濠公園・櫛田神社・Shopping Day","由鳥栖入福岡市區：朝早大濠公園，晏晝櫛田神社，下晝天神／博多 Shopping，夜晚同 Nick 食飯。留意星期二かろのうろん同徳永屋都休息。",[["午餐 · 約12:30 · 大濠公園",[66,67],"首選讃岐うどん 志成：大濠公園站行3分鐘，Tabelog 約3.58，11:00–14:00，經常要排30分鐘以上。唔想排就去公園 Boathouse 嘅 Royal Garden Cafe，睇住個湖食。"],["下午 · 約14:00 · 櫛田神社／川端",[],"櫛田神社隔籬嘅かろのうろん星期二休息。川端商店街有川端ぜんざい等小食，淺嚐就夠，留肚夜晚食鰻魚或釜飯。"],["晚餐 · 約18:30 · Dinner with Nick",[60,69],"連 Nick 4個人，Nick 腸胃麻麻唔打邊爐。首選吉塚うなぎ屋（中洲，鰻魚百名店，21:00收，L.O.20:15）：有枱坐得舒服，建議訂位；鰻魚偏油，Nick 可以叫細份或鰻魚玉子卷。想清淡啲就去天神釜めしビクトリア，但19:00截單，要18:00前到。揸車返鳥栖嗰位唔好飲酒。"]]],["11.18","三","鳥栖退房・機場","13:25航班，10:30左右還車，先確保準時報到。",[["早餐 · 08:00–08:30 · 酒店／便利店",[],"首選酒店早餐或便利店，早啲離開鳥栖以免高速公路塞車。唔建議為人氣食店延誤10:30前後還車。"],["機場候機時輕食 · 辦妥報到後",[28],"如果已經完成還車、國際線報到及安檢，先按航廈內實際餐飲選擇食嘢；唔好假設國內線拉麵店喺國際線。"]]]],"mustEats":[48,50,51,53,54,55]};const PHOTOS={"real":{"1":["https://tblg.k-img.com/restaurant/images/Rvw/334337/640x640_rect_a438e067b32d37238d4b05a554142955.jpg"],"2":["https://tblg.k-img.com/restaurant/images/Rvw/207518/640x640_rect_559d88e2cb13bd924739fba2b44ccf22.jpg","https://tblg.k-img.com/restaurant/images/Rvw/191332/640x640_rect_aa71f9979a580bc33a9cdee4d49d2d85.jpg"],"3":["https://static.wixstatic.com/media/ca4988_a7e7ad6140e14feaa6eaf8ae29e384d3~mv2.jpg/v1/fill/w_605%2Ch_645%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/%E3%83%A9%E3%83%BC%E3%83%A1%E3%83%B3%E2%91%A0.jpg"],"4":["https://tblg.k-img.com/restaurant/images/Rvw/216369/640x640_rect_8ca5dcb36a99f03925943b57b7add3d9.jpg"],"5":["https://news.walkerplus.com/article/121297/779056_615.jpg"],"6":["https://stat.ameba.jp/user_images/20211114/23/lapis3m/12/a2/j/o1080108015031583237.jpg"],"7":["https://media.tripl
